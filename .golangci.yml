version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - noctx
    - nolintlint
    - usestdlibvars
  exclusions:
    rules:
      # Tests may use plain http.Get and ignore Close errors.
      - path: _test\.go
        linters:
          - bodyclose
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
