name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          # Also key on the pinned golangci-lint version so its go run
          # build is cached.
          cache-dependency-path: |
            go.sum
            .golangci-version

      - name: Check
        run: make check-go

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        # Reads the pnpm version from packageManager in web/package.json.
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Check
        run: make check-web

  smoke:
    # The full build (frontend embedded into the Go binary), then the binary
    # is started and checked.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build and smoke test
        run: make smoke

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: watcht:ci
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: scripts/docker-smoke.sh watcht:ci
