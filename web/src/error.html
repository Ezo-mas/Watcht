<!doctype html>
<!--
	SvelteKit's static error page. It replaces the whole document when the
	root layout's load fails (for example, the session check gets an error
	from the server), so it can't use the app's stylesheet: the colours below
	repeat the tokens in src/routes/layout.css. Keep the two in step.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Error · watcht</title>
		<style>
			:root {
				color-scheme: light dark;
				--canvas: #eef1f5;
				--surface: #ffffff;
				--line: #d5dbe4;
				--ink: #151b26;
				--muted: #535e70;
				--accent: #e3961f;
				--accent-hover: #d08614;
				--on-accent: #1c1204;
				--focus: #a35d00;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--canvas: #131a24;
					--surface: #1a2230;
					--line: #2b3546;
					--ink: #e7eaf0;
					--muted: #9da7b9;
					--accent: #f0a73a;
					--accent-hover: #f6b95e;
					--focus: #f0a73a;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: flex;
				justify-content: center;
				padding: 12vh 1rem 3rem;
				background: var(--canvas);
				color: var(--ink);
				font-family:
					system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					'Noto Sans',
					Ubuntu,
					Cantarell,
					'Helvetica Neue',
					Arial,
					sans-serif;
				line-height: 1.5;
			}
			.column {
				width: 100%;
				max-width: 22rem;
				display: flex;
				flex-direction: column;
				gap: 1.5rem;
			}
			.wordmark {
				display: inline-flex;
				flex-direction: column;
				gap: 0.16em;
				align-self: flex-start;
				font-size: 1.875rem;
				font-weight: 800;
				letter-spacing: -0.04em;
				line-height: 1;
			}
			.wordmark .bar {
				display: flex;
				height: 0.12em;
				border-radius: 9999px;
				overflow: hidden;
			}
			.wordmark .bar span:first-child {
				width: 83%;
				background: var(--accent);
			}
			.wordmark .bar span:last-child {
				flex: 1;
				background: var(--line);
			}
			.card {
				border: 1px solid var(--line);
				border-radius: 0.5rem;
				background: var(--surface);
				padding: 1.5rem;
				box-shadow: 0 1px 2px rgb(0 0 0 / 0.06);
			}
			h1 {
				margin: 0;
				font-size: 1.125rem;
				font-weight: 600;
				letter-spacing: -0.025em;
			}
			p {
				margin: 1.25rem 0 0;
				font-size: 0.875rem;
			}
			.detail {
				margin-top: 0.5rem;
				font-size: 0.75rem;
				color: var(--muted);
			}
			a {
				margin-top: 1.25rem;
				display: flex;
				height: 2.5rem;
				align-items: center;
				justify-content: center;
				border-radius: 0.375rem;
				background: var(--accent);
				color: var(--on-accent);
				font-size: 0.875rem;
				font-weight: 500;
				text-decoration: none;
			}
			a:hover {
				background: var(--accent-hover);
			}
			a:focus-visible {
				outline: 2px solid var(--focus);
				outline-offset: 2px;
			}
		</style>
	</head>
	<body>
		<main class="column">
			<span class="wordmark">
				<span>watcht</span>
				<span class="bar" aria-hidden="true"><span></span><span></span></span>
			</span>
			<section class="card" aria-labelledby="title">
				<h1 id="title">Can't load this page</h1>
				<p>
					The watcht server didn't answer, or it ran into a problem. If it's restarting, try again
					in a moment.
				</p>
				<p class="detail">Error %sveltekit.status%: %sveltekit.error.message%</p>
				<a href="" data-sveltekit-reload>Try again</a>
			</section>
		</main>
	</body>
</html>
